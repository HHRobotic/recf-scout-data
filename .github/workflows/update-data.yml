name: Update RECF Scout CSV data

on:
  schedule:
    # Hourly at minute 17 UTC. GitHub may delay scheduled starts during busy periods.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recf-scout-data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      # The script caches fetched event/API data locally. Restore that cache
      # between hourly runs so it does not need to fetch all historical data.
      - name: Restore backend data cache
        uses: actions/cache@v4
        with:
          path: cache/
          key: recf-data-cache-${{ runner.os }}-${{ hashFiles('recf_elo.py') }}-${{ github.run_id }}
          restore-keys: |
            recf-data-cache-${{ runner.os }}-${{ hashFiles('recf_elo.py') }}-

      - name: Generate CSV files
        env:
          # Optional. The Python script accepts RECF_TOKEN, but it can be empty.
          RECF_TOKEN: ${{ secrets.RECF_TOKEN }}
        run: python recf_elo.py --out out --cache cache

      - name: Commit updated CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add out/ratings.csv out/solo_scores.csv
          if git diff --cached --quiet; then
            echo "CSV data has not changed; nothing to commit."
          else
            git commit -m "Update RECF Scout CSV data"
            git push
          fi
