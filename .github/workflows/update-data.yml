name: Update RECF Scout data

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:
    inputs:
      reset_cache:
        description: "Ignore the saved API cache and refetch everything (slow; may take several runs)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # only used to delete old cache entries

concurrency:
  group: recf-scout-data-update
  cancel-in-progress: false

env:
  CACHE_VERSION: v1   # bump this to throw away the saved cache (for example if its format ever changes)
  PYTHONUNBUFFERED: "1"

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      # GitHub caches are write-once: a key that already exists is never overwritten. So every run saves under a
      # NEW key (run id) and restores the newest older entry through the restore-keys prefix.
      - name: Restore API cache
        id: cache-restore
        if: ${{ inputs.reset_cache != true }}
        uses: actions/cache/restore@v6
        with:
          path: cache/
          key: recf-cache-${{ env.CACHE_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            recf-cache-${{ env.CACHE_VERSION }}-

      - name: Generate CSV and JSON data
        env:
          RECF_TOKEN: ${{ secrets.RECF_TOKEN }}
        run: |
          touch "$RUNNER_TEMP/cache-marker"
          ARGS="--out out --cache cache"
          python recf_elo.py $ARGS

      - name: Did the cache change?
        id: cache-changed
        if: ${{ !cancelled() }}
        run: |
          changed=false
          if [ -d cache ] && [ -n "$(find cache -type f -newer "$RUNNER_TEMP/cache-marker" -print -quit)" ]; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "restored from: '${{ steps.cache-restore.outputs.cache-matched-key }}'  changed: $changed"
          du -sh cache 2>/dev/null || true

      # Saved before committing, so a failed push can never lose a long fetch.
      - name: Save API cache
        if: ${{ !cancelled() && steps.cache-changed.outputs.changed == 'true' }}
        uses: actions/cache/save@v6
        with:
          path: cache/
          key: recf-cache-${{ env.CACHE_VERSION }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Check the run finished
        id: run-status
        run: |
          python - <<'PY'
          import json, os
          try:
              s = json.load(open("out/run_status.json"))
              ok = bool(s.get("complete"))
              print(f"complete={ok} aborted={s.get('aborted')} pending={s.get('pending')} of {s.get('events')} events")
          except Exception as e:
              ok = False
              print("no usable out/run_status.json:", e)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"complete={'true' if ok else 'false'}\n")
          PY

      - name: Skip commit (run incomplete)
        if: ${{ steps.run-status.outputs.complete != 'true' }}
        run: |
          echo "::warning::Run incomplete (time budget reached or the API was failing). The cache was saved and the next run continues; nothing is committed so the site keeps the last complete data."

      - name: Commit updated data files
        if: ${{ steps.run-status.outputs.complete == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- out/ratings.csv out/solo_scores.csv out/v1
          if git diff --cached --quiet; then
            echo "Data has not changed; nothing to commit."
            exit 0
          fi
          git commit -m "Update RECF Scout data"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main
            if git push origin main; then
              echo "Successfully pushed data updates."
              exit 0
            fi
            echo "Push attempt $attempt failed."
            sleep 2
          done
          echo "Failed to push after 3 attempts."
          exit 1

      # Every changed run adds a new cache entry. Keep only the newest two so they do not crowd out other caches.
      - name: Delete old cache entries
        if: ${{ !cancelled() && steps.cache-changed.outputs.changed == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --key "recf-cache-${CACHE_VERSION}-" --sort created_at --order desc --limit 100 --json id --jq '.[2:][].id' |
            while read -r id; do gh cache delete "$id"; done
