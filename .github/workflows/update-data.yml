name: Update RECF Scout CSV data

on:
  schedule:
    # GitHub may delay scheduled starts during busy periods.
    - cron: "0 * * * *" 
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recf-scout-data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore backend data cache
        uses: actions/cache@v6
        with:
          path: cache/
          key: recf-data-cache-${{ runner.os }}-${{ hashFiles('recf_elo.py') }}
          restore-keys: |
            recf-data-cache-${{ runner.os }}-${{ hashFiles('recf_elo.py') }}-

name: Update RECF Scout CSV data

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recf-scout-data-update
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore backend data cache
        uses: actions/cache@v4
        with:
          path: cache/
          key: recf-data-cache-${{ runner.os }}-${{ hashFiles('recf_elo.py') }}
          restore-keys: |
            recf-data-cache-${{ runner.os }}-${{ hashFiles('recf_elo.py') }}-

      - name: Generate CSV files
        env:
          RECF_TOKEN: ${{ secrets.RECF_TOKEN }}
        run: python recf_elo.py --out out --cache cache

      - name: Commit updated CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add out/ratings.csv out/solo_scores.csv

          if git diff --cached --quiet; then
            echo "CSV data has not changed; nothing to commit."
          else
            git commit -m "Update RECF Scout CSV data"
            git push
          fi
